name: cloud-refresh

# Daily cloud run of the refresh + publish chain (the twin of
# Z_BTCTrueVolumerefresh-and-publish.bat): refresh every feed to the latest
# Binance Vision day, re-export the static site, verify, then push to branch
# `main` for Pages. FOUR attempts a day -- 15:47, 17:17, 20:37 and 22:17
# Asia/Bangkok (08:47 / 10:17 / 13:37 / 15:17 UTC). Vision publishes the
# previous day's daily zips at ~07:51-09:43 UTC (14:51-17:43 Thai, with
# occasional late days up to 21:17 Thai), so the first slot sits just after
# the usual publish and the rest are safety nets. A 00:07 UTC morning run was
# tried and never advanced the newest daily bar -- Vision had not published
# yet. GitHub's scheduler fires hours late and sometimes drops a slot outright
# (both 2026-10-19 slots were lost), so redundant attempts are the no-secret
# defence; every run is idempotent. Minutes are deliberately off :00/:30 --
# the top of the hour is when the queue is longest. Also runs when this file
# changes, and on demand (Actions -> Run workflow; tick `dry_run` to skip the
# push). Needs no secrets (the chain is keyless; ETHERSCAN_API_KEY only
# upgrades the ETH tx tier).
#
# Runner layout (the workspace root stands in for D:\kp_ai_agent):
#   data_registry.yaml                            - state (seeded; used by verify_all)
#   Dataset_Fetcher/true_volume_pipeline_log.md   - state (seeded)
#   Dataset_Fetcher/BTC_True_Volume/              - checkout of branch `src` (CODE)
#   Dataset_Fetcher/BTC_True_Volume/site/         - checkout of branch `main` (SITE)
#   Dataset_Fetcher/BTC_True_Volume/{processed,raw}
#   Dataset_Fetcher/{binance_full_dataset,onchain_dataset,dataset_1d}
#       - the ~3.3 GB pipeline state: travels via the Actions cache `state-*`
#         (newest wins), with a weekly copy in the `state-backup` release as
#         fallback. Never committed - several files exceed GitHub's 100 MB
#         limit. Only what the daily chain reads is seeded (the BTC/ETH
#         klines dirs of both futures_um and spot, aggTrades/*/extension;
#         NOT the multi-GB tape merged.parquet or ETH daily/, which the
#         checkpoints skip on purpose).
#
# If both cache and release are empty, the refresh job FAILS (red, so it is
# noticed) instead of warning its way to a green no-op. (One-time seed uploaded
# 2026-10-15; from the first successful run on, the Actions cache carries the
# state forward and the release is refreshed every Sunday as a fallback.)
#
# verify_all tolerates an ETF-flow store trailing the bars by up to three
# calendar days: it is session-dated (no weekend points) and upstream publishes
# each session a day late, so a one-day rule failed every weekend (2026-10-19:
# bars reached Saturday 18th while the chart still ended Thursday 16th).

on:
  schedule:
    - cron: "47 8 * * *"    # 15:47 Asia/Bangkok, after Vision's usual publish
    - cron: "17 10 * * *"   # 17:17 Asia/Bangkok, retry (GitHub drops/late-fires events)
    - cron: "37 13 * * *"   # 20:37 Asia/Bangkok, safety net for late-publish days
    - cron: "17 15 * * *"   # 22:17 Asia/Bangkok, late-publish catch-all
  workflow_dispatch:
    inputs:
      dry_run:
        description: "refresh + export + verify, but do not push to main"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [".github/workflows/cloud-refresh.yml"]

permissions:
  contents: write
  pages: write

concurrency:
  group: cloud-refresh
  cancel-in-progress: false

env:
  PYTHONIOENCODING: utf-8

jobs:
  smoke:
    name: upstream reachability (gate 0)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: curl the exact upstreams the pipeline uses
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: |
          set -u
          fail=0
          check() {   # $1=label, $2=url, $3=extra curl args (optional)
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 \
                   ${3:-} "$2" || echo 000)
            printf '%s  %s\n' "$code" "$1"
            case "$code" in 2*|3*) ;; *)
              echo "::error::upstream check failed: $1 (HTTP $code) $2"
              fail=1 ;;
            esac
          }
          D=$(date -u -d '2 days ago' +%F)     # Vision daily zips publish with ~1 day lag
          BD=$(date -u -d '10 days ago' +%F)   # any settled bitview anchor answers
          V=https://data.binance.vision/data/futures/um/daily
          # Additive datasets: log reachability but never block the core refresh.
          soft_check() {   # $1=label, $2=url, $3=extra curl args
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 \
                   ${3:-} "$2" || echo 000)
            printf '%s  %s (soft)\n' "$code" "$1"
          }
          # Vision can miss a whole day (2026-10-28 klines/aggTrades are absent
          # while metrics exist), and the refresh itself probes the newest
          # published day over a 3-day window.  A gate pinned to exactly "2 days
          # ago" therefore blocks every run through a single upstream gap; this
          # one only requires SOME recent day to exist.
          check_any() {   # $1=label, $2=url prefix, $3=url suffix, $4=extra curl args, $5=offsets
            local off d code found=0
            for off in ${5:-2 3 4}; do
              d=$(date -u -d "$off days ago" +%F)
              code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 \
                     ${4:-} "$2$d$3" || echo 000)
              printf '%s  %s (%s)\n' "$code" "$1" "$d"
              case "$code" in 2*|3*) found=1; break ;; esac
            done
            if [ "$found" != 1 ]; then
              echo "::error::Vision check failed: $1 (no file for the last 3 days)"
              fail=1
            fi
          }
          check_any "vision klines"    "$V/klines/BTCUSDT/1d/BTCUSDT-1d-" ".zip" "-r 0-99"
          check_any "vision aggTrades" "$V/aggTrades/BTCUSDT/BTCUSDT-aggTrades-" ".zip" "-r 0-99"
          check_any "vision metrics"   "$V/metrics/BTCUSDT/BTCUSDT-metrics-" ".zip" "-r 0-99"
          soft_check "vision bookDepth" "$V/bookDepth/BTCUSDT/BTCUSDT-bookDepth-$D.zip" "-r 0-99"
          check "coinmetrics"      "https://community-api.coinmetrics.io/v4/timeseries/asset-metrics?assets=btc&metrics=PriceUSD&page_size=1"
          check "blockchain.info"  "https://api.blockchain.info/charts/market-price?timespan=1days&format=json"
          check "checkonchain cdn" "https://charts-cdn.checkonchain.com/btconchain/etfs/etf_flowsvsprice/etf_flowsvsprice_light.html"
          soft_check "checkonchain transfer volume" "https://charts-cdn.checkonchain.com/btconchain/adoption/transfer_volumes_usd/transfer_volumes_usd_light.html"
          check "checkonchain web" "https://charts.checkonchain.com/"
          # The tree API is a secondary source for the URPD collector (the CDN
          # index and our raw cache cover it), and unauthenticated calls are
          # routinely rate-limited on shared runner IPs -- a 403 here must not
          # block the refresh.  Authenticate with the workflow token, and treat
          # 403 as "degraded, proceed" rather than a failed upstream.
          tree_code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 30 \
                      -H "Authorization: Bearer ${{ github.token }}" \
                      "https://api.github.com/repos/checkmatey/checkonchain.com/git/trees/main" || echo 000)
          printf '%s  %s\n' "$tree_code" "github tree"
          case "$tree_code" in 2*|3*|403) ;; *) fail=1 ;; esac
          check "github raw"       "https://raw.githubusercontent.com/checkmatey/checkonchain.com/main/README.md"
          # bitview's dated-curve API 404s wholesale as of 2026-10-31 (every
          # date AND its dates list). The cost-basis collector falls back to its
          # raw cache and the checkonchain dated store, so this is additive:
          # log it, never block the core refresh on it.
          soft_check "bitview" "https://bitview.space/api/series/cost-basis/all/$BD?bucket=lin200"
          if [ -n "${ETHERSCAN_API_KEY:-}" ]; then
            check "etherscan" "https://api.etherscan.io/api?module=stats&action=ethsupply"
          else
            echo "skip  etherscan (no ETHERSCAN_API_KEY secret; the chain is keyless)"
          fi
          exit $fail

  refresh:
    name: refresh + publish
    needs: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: checkout source (branch src)
        uses: actions/checkout@v4
        with:
          ref: src
          path: Dataset_Fetcher/BTC_True_Volume
          fetch-depth: 1

      - name: drop the src branch's data copies (state comes from cache/seed)
        run: |
          rm -rf Dataset_Fetcher/BTC_True_Volume/processed \
                 Dataset_Fetcher/BTC_True_Volume/raw

      - name: checkout site (branch main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: Dataset_Fetcher/BTC_True_Volume/site
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Dataset_Fetcher/BTC_True_Volume/requirements-lock.txt

      - name: install dependencies (pinned freeze from the PC)
        run: pip install -r Dataset_Fetcher/BTC_True_Volume/requirements-lock.txt

      - name: restore pipeline state (cache)
        uses: actions/cache/restore@v4
        with:
          path: |
            data_registry.yaml
            Dataset_Fetcher/true_volume_pipeline_log.md
            Dataset_Fetcher/BTC_True_Volume/processed
            Dataset_Fetcher/BTC_True_Volume/raw
            Dataset_Fetcher/binance_full_dataset
            Dataset_Fetcher/onchain_dataset
            Dataset_Fetcher/dataset_1d
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: state-

      - name: seed fallback (state-backup release) if still missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f data_registry.yaml ]; then echo "state restored from cache"; exit 0; fi
          mkdir -p _seed
          gh release download state-backup --dir _seed --repo "${{ github.repository }}" || true
          if ! ls _seed/part-* >/dev/null 2>&1; then
            echo "no seed parts in the 'state-backup' release yet"
            exit 0
          fi
          cat _seed/part-* | tar -x -C "$GITHUB_WORKSPACE"
          rm -rf _seed
          ls -l data_registry.yaml

      - name: pipeline state present?
        # HARD FAIL, not a warning: every real step below is gated on
        # `_state_ready`, so a warning here turns the whole job into a green
        # no-op -- the 2026-10-15 runs 1 and 2 "succeeded" without refreshing,
        # exporting or pushing anything. A red run is the only version of this
        # state that someone notices.
        run: |
          if [ -f data_registry.yaml ] && [ -d Dataset_Fetcher/BTC_True_Volume/processed ]; then
            touch _state_ready
            echo "state present - the refresh will run"
          else
            echo "::error title=state not seeded::Pipeline state missing from both the Actions cache and the state-backup release. Restore the 'state-backup' release (or the newest state-* cache), then re-run."
            exit 1
          fi

      - name: refresh feeds (incremental)
        if: hashFiles('_state_ready') != ''
        working-directory: Dataset_Fetcher/BTC_True_Volume
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python refresh_before_visualizer.py --no-launch

      - name: re-export site + commit (no push yet)
        if: hashFiles('_state_ready') != ''
        working-directory: Dataset_Fetcher/BTC_True_Volume
        run: python publish_site.py --no-push

      # A run that fetches nothing exits green with an unchanged data_version --
      # which looks identical to "Vision has not published yet".  When Vision
      # HAS published the previous day (1h zips drive the newest resampled 1d
      # bar), the export must contain it; otherwise this run is red before the
      # push, instead of silently leaving the page a day behind.
      - name: freshness guard (a published Vision day must be exported)
        if: hashFiles('_state_ready') != ''
        run: |
          set -u
          D=$(date -u -d 'yesterday' +%F)
          URL="https://data.binance.vision/data/futures/um/daily/klines/BTCUSDT/1h/BTCUSDT-1h-$D.zip"
          code=$(curl -s -o /dev/null -w '%{http_code}' -I -L --max-time 30 "$URL" || echo 000)
          if [ "$code" != "200" ]; then
            echo "Vision $D is not published yet (HTTP $code) — nothing to require"
            exit 0
          fi
          got=$(python -c "import json;print(json.load(open('Dataset_Fetcher/BTC_True_Volume/site/manifest.json'))['data_version'])")
          echo "Vision has $D; export data_version=$got"
          if [[ "$got" < "$D" ]]; then
            echo "::error::export is behind Vision: data_version=$got but $D is published"
            exit 1
          fi

      # ONE COMMAND PER STEP, named, on purpose: a red verify step whose log
      # sits behind authentication cannot say which of the four failed, and the
      # step's name is the only part of a failed run you can read unauthenticated
      # (2026-10-16: it was the dated-pair probe, whose flag-text expectation had
      # gone stale behind a wording change in app.js).
      - name: verify (verify_all)
        if: hashFiles('_state_ready') != ''
        working-directory: Dataset_Fetcher/BTC_True_Volume
        run: python verify_all.py

      - name: verify (probe_dates — the typed date boxes)
        if: hashFiles('_state_ready') != ''
        working-directory: Dataset_Fetcher/BTC_True_Volume
        run: node probe_dates.js

      - name: verify (probe_dated_server — dump the API's own bodies)
        if: hashFiles('_state_ready') != ''
        working-directory: Dataset_Fetcher/BTC_True_Volume
        run: python probe_dated_server.py

      - name: verify (probe_dated_pair — browser vs API field for field)
        if: hashFiles('_state_ready') != ''
        working-directory: Dataset_Fetcher/BTC_True_Volume
        run: node probe_dated_pair.js

      - name: verify (probe_orderbook — the depth-heat grids)
        if: hashFiles('_state_ready') != ''
        working-directory: Dataset_Fetcher/BTC_True_Volume
        run: node probe_orderbook.js

      - name: push site to main
        if: hashFiles('_state_ready') != '' && !inputs.dry_run
        working-directory: Dataset_Fetcher/BTC_True_Volume/site
        run: git push origin main

      - name: request a Pages build
        if: hashFiles('_state_ready') != '' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/pages/builds" --jq '.status' \
            || echo "Pages build request failed (the push may have queued one already)"

      - name: save pipeline state (cache)
        if: always() && hashFiles('_state_ready') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            data_registry.yaml
            Dataset_Fetcher/true_volume_pipeline_log.md
            Dataset_Fetcher/BTC_True_Volume/processed
            Dataset_Fetcher/BTC_True_Volume/raw
            Dataset_Fetcher/binance_full_dataset
            Dataset_Fetcher/onchain_dataset
            Dataset_Fetcher/dataset_1d
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: weekly release backup (Sundays)
        if: always() && hashFiles('_state_ready') != '' && github.event_name == 'schedule' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" != "7" ]; then echo "not Sunday - skipping the release backup"; exit 0; fi
          mkdir -p _backup
          tar -C "$GITHUB_WORKSPACE" -cf - \
              data_registry.yaml \
              Dataset_Fetcher/true_volume_pipeline_log.md \
              Dataset_Fetcher/BTC_True_Volume/processed \
              Dataset_Fetcher/BTC_True_Volume/raw \
              Dataset_Fetcher/binance_full_dataset \
              Dataset_Fetcher/onchain_dataset \
              Dataset_Fetcher/dataset_1d \
            | split -b 1900M - _backup/part-
          gh release view state-backup --repo "${{ github.repository }}" >/dev/null 2>&1 \
            || gh release create state-backup --repo "${{ github.repository }}" \
                 --title "pipeline state backup" \
                 --notes "Auto-uploaded weekly (Sundays) by the cloud-refresh workflow."
          gh release upload state-backup _backup/part-* --clobber --repo "${{ github.repository }}"
